# 20 clean (no fault injected, F0) support tickets for P1-T5.
# Target: >= 90% reach the expected decision with agent_default.
#
# Each expected decision follows from the KB (data/kb) applied to the fixture DB
# (data/fixtures/default_db.json, as_of 2026-01-20); the `why` comment gives the rule.
# required_facts are strings the reply should contain; P1-T7's checker grades them.
# These tickets were also used while writing the prompts, so they are a dev set:
# held-out accuracy comes from the generated scenarios in Phase 4.

- scenario_id: clean-01
  category: refund
  # KB-REF-001: 18 days after delivery < 30-day window, unused -> approve.
  ticket: {ticket_id: T-0101, customer_id: C001, subject: Return a sweater,
    body: "Hi, I'd like to return the wool sweater from order O1001. It doesn't fit and I never wore it, tags still on. Can I get a refund?"}
  ground_truth: {fault_code: F0, expected_final: {decision: approve, required_facts: ["5-7 business days"]}}

