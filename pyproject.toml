[project]
name = "agenttrace"
version = "0.1.0"
description = "Debugging and continuous-explainability platform for multi-agent AI workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
agenttrace = "agenttrace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenttrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "smoke: live calls to model providers (run via `python tasks.py smoke`)",
]
addopts = "-m 'not smoke'"

[tool.ruff]
line-length = 100
target-version = "py311"
# Don't reformat code snippets embedded in docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["agenttrace"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
