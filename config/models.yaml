# Model roles -> provider, model ID, params, and pricing.
#
# Rules (CLAUDE_meta.md section 2):
#   - Model IDs live ONLY in this file. Swap a role's model by editing it here.
#   - Anything not confirmed from a provider dashboard is TODO_VERIFY. The gateway
#     refuses to call a TODO_VERIFY model or endpoint.
#   - Pricing is USD per million tokens. A model with no pricing entry is still
#     callable, but its cost is logged as unknown (0).
#   - Judges and agents run at temperature 0 so cached replays are reproducible.
#   - Per-provider `budget_usd` (hard stop) and `warn_usd` cap lifetime spend, read
#     back from .cache/calls.jsonl. Global caps are MAX_USD_TOTAL / MAX_USD_PER_RUN in .env.

providers:
  meta:
    # Meta Model API. OpenAI-compatible Chat Completions. Auth: Bearer MODEL_API_KEY.
    base_url: https://api.meta.ai/v1
    api_key_env: MODEL_API_KEY
    supports_json_mode: true    # verified 2026-10-31: response_format json_object accepted
    # Muse models reason before answering, and reasoning tokens count toward max_tokens.
    # `reasoning_effort` accepts: minimal, low, medium, high, xhigh, max (not "none").
    # Measured on a one-word reply: Spark default ~480 reasoning tokens, low ~90,
    # minimal ~10. Wonder default ~60. Leave enough max_tokens for reasoning + answer.
    timeout_s: 120
    max_retries: 4
    # $150 of Meta credits: hard stop at $140, warn at $100 (phases.md budget plan).
    budget_usd: 140
    warn_usd: 100
    # IDs confirmed via GET /v1/models; pricing from the Model API dashboard (2026-10-31).
    # Cached-input prices (Wonder $0.20, Spark $0.15) are not used yet: costs are
    # computed at the full input price, which errs high.
    models:
      muse-wonder-1.0:
        input_per_m: 4.00
        output_per_m: 20.00
      muse-spark-1.3:
        input_per_m: 1.25
        output_per_m: 4.25
      # Same model as 1.3 at ~95% less, but inputs/outputs are used to train Meta's
      # models, it is rate-limited by tokens, and only in select countries.
      muse-spark-1.3-contributor:
        input_per_m: 0.10
        output_per_m: 0.20

  nvidia:
    # NVIDIA hosted NIM (build.nvidia.com). OpenAI-compatible. Auth: Bearer NVIDIA_API_KEY.
    # Verified 2026-11-01: GET /v1/models lists 85 models, but most return 404 "not found
    # for account" or time out. The four below answered a test prompt (see findings.md).
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    supports_json_mode: true    # verified 2026-11-01: response_format json_object accepted
    # Nemotron models think before answering unless the chat template turns it off:
    # chat_template_kwargs {enable_thinking: false} cut ~500 -> ~45 output tokens, 5s -> 1.3s.
    # Mistral Large 4 calls can exceed 120s on the free tier (measured read timeouts).
    timeout_s: 240
    max_retries: 4
    # Free build.nvidia.com tier: no per-token charge (request-limited), so priced at 0.
    models:
      nvidia/nemotron-3.5-lightning-30b-a3b: {input_per_m: 0.0, output_per_m: 0.0}
      nvidia/nemotron-3-ultra-550b-a55b: {input_per_m: 0.0, output_per_m: 0.0}
      nvidia/nemotron-3.5-bolt-e4b: {input_per_m: 0.0, output_per_m: 0.0}
      mistralai/mistral-large-4-1t-a52b: {input_per_m: 0.0, output_per_m: 0.0}

  openrouter:
    # OpenRouter (open-source judges / agents under test). OpenAI-compatible.
    # Endpoint taken from OpenRouter's public API docs.
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    supports_json_mode: false
    timeout_s: 120
    max_retries: 4
    models: {}   # add pricing per model once chosen (see the model's OpenRouter page)

  local:
    # Local vLLM or any OpenAI-compatible server. LOCAL_OPENAI_BASE_URL overrides base_url.
    # vLLM accepts any non-empty key unless started with --api-key.
    base_url: http://localhost:8000/v1
    base_url_env: LOCAL_OPENAI_BASE_URL
    api_key_env: LOCAL_OPENAI_API_KEY
    supports_json_mode: false
    timeout_s: 300
    max_retries: 2
    models: {}   # local inference: leave unpriced or price at 0

roles:
  # --- Judges -------------------------------------------------------------
  judge_fast:
    # Muse Spark: per-node anomaly scoring, claim checks, first-pass diagnosis.
    provider: meta
    model: muse-spark-1.3
    # High-volume role: keep reasoning low. Revisit after P6-T1 judge-quality checks.
    params: {temperature: 0, max_tokens: 4096, reasoning_effort: low}

  judge_deep:
    # Muse Wonder: escalated investigation only (see config/escalation.yaml, Phase 6).
    provider: meta
    model: muse-wonder-1.0
    # Deep investigation: default reasoning effort, generous output budget.
    params: {temperature: 0, max_tokens: 8192}

  judge_nvidia:
    # Independent open-weight judge: the largest Nemotron that answers on this key.
    # Thinking stays on (judging benefits from it); occasional 503s are retried.
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    params: {temperature: 0, max_tokens: 4096}

  judge_oss:
    # Independent open-source judge, also used for high-volume continuous scoring.
    provider: openrouter
    model: TODO_VERIFY        # e.g. a Llama / Qwen / Mistral instruct model
    params: {temperature: 0, max_tokens: 1024}

  # --- Agents under test ---------------------------------------------------
  # Non-Meta by default so Meta credits go to diagnosis (see phases.md budget plan).
  # No OpenRouter key yet, so all three run on NVIDIA's free tier.
  agent_default:
    # Mid-size Nemotron (30B MoE, 3B active), thinking off: ~1-2s per call.
    # Thinking on was tried: some calls spent all 4096 tokens reasoning with no output.
    provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
    params: {temperature: 0, max_tokens: 1024, chat_template_kwargs: {enable_thinking: false}}

  agent_alt_1:
    # Different model family (Mistral). Always reasons (enable_thinking: false still reasons;
    # reasoning_effort: none -> HTTP 400), 30-60s per call on the free tier. Needs room for
    # reasoning: at max_tokens 1024 a call spent 1023 tokens thinking and returned nothing.
    provider: nvidia
    model: mistralai/mistral-large-4-1t-a52b
    params: {temperature: 0, max_tokens: 4096}

  agent_alt_3:
    # Largest Nemotron (550B MoE), thinking off: ~2s per call. Also the judge_nvidia model,
    # so don't judge this profile's runs with judge_nvidia (self-evaluation bias).
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    params: {temperature: 0, max_tokens: 1024, chat_template_kwargs: {enable_thinking: false}}

  agent_alt_2:
    # Small, fast Nemotron: the "weaker agent" for model-agnostic evaluation.
    provider: nvidia
    model: nvidia/nemotron-3.5-bolt-e4b
    params: {temperature: 0, max_tokens: 1024}
